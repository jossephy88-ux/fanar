<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FANAR — Sistema de Registro de Placas</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --amarillo: #FFD700;
    --amarillo2: #FFC200;
    --negro: #0D0D0D;
    --gris1: #1A1A1A;
    --gris2: #2A2A2A;
    --gris3: #3A3A3A;
    --gris4: #555;
    --blanco: #F5F5F0;
    --rojo: #FF3B3B;
    --verde: #00C97A;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--negro);
    color: var(--blanco);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--gris1);
    border-bottom: 3px solid var(--amarillo);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    height: 64px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo-icon {
    width: 40px; height: 40px;
    background: var(--amarillo);
    display: flex; align-items: center; justify-content: center;
    clip-path: polygon(0 0, 85% 0, 100% 15%, 100% 100%, 15% 100%, 0 85%);
  }
  .logo-icon svg { width: 22px; height: 22px; }
  .logo-text { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 3px; color: var(--amarillo); }
  .logo-sub { font-size: 10px; color: var(--gris4); letter-spacing: 2px; text-transform: uppercase; margin-top: -2px; }
  .header-right { display: flex; align-items: center; gap: 20px; }
  .periodo-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    background: var(--gris2);
    border: 1px solid var(--gris3);
    padding: 5px 12px;
    border-radius: 4px;
    color: var(--amarillo);
  }
  .stats-header { display: flex; gap: 16px; }
  .stat-pill {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-family: 'IBM Plex Mono', monospace;
    background: var(--gris2); padding: 4px 10px; border-radius: 20px;
  }
  .stat-pill .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-moto { background: var(--amarillo); }
  .dot-vehiculo { background: #4FC3F7; }

  /* ── TABS ── */
  .tabs {
    display: flex;
    border-bottom: 2px solid var(--gris2);
    background: var(--gris1);
  }
  .tab-btn {
    flex: 1; max-width: 220px;
    padding: 16px 24px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 2px;
    color: var(--gris4);
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    cursor: pointer;
    transition: all .2s;
    display: flex; align-items: center; gap: 10px;
  }
  .tab-btn svg { opacity: .5; transition: opacity .2s; }
  .tab-btn:hover { color: var(--blanco); }
  .tab-btn.active { color: var(--amarillo); border-bottom-color: var(--amarillo); }
  .tab-btn.active svg { opacity: 1; }

  /* ── LAYOUT ── */
  .main { display: grid; grid-template-columns: 360px 1fr; height: calc(100vh - 130px); }

  /* ── FORM PANEL ── */
  .form-panel {
    background: var(--gris1);
    border-right: 2px solid var(--gris2);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--gris2);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; color: var(--amarillo); }

  .form-body { padding: 20px 24px; overflow-y: auto; flex: 1; }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gris4);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .field input, .field textarea {
    width: 100%;
    background: var(--gris2);
    border: 1px solid var(--gris3);
    border-radius: 6px;
    color: var(--blanco);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
    transition: border-color .2s;
  }
  .field input:focus, .field textarea:focus {
    border-color: var(--amarillo);
    background: var(--gris2);
  }
  .field input.placa-input {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--amarillo);
  }
  .field textarea { resize: vertical; min-height: 70px; }

  .btn-registrar {
    width: 100%; padding: 14px;
    background: var(--amarillo);
    color: var(--negro);
    border: none; border-radius: 6px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px; letter-spacing: 3px;
    cursor: pointer;
    transition: background .2s, transform .1s;
    margin-top: 4px;
  }
  .btn-registrar:hover { background: var(--amarillo2); transform: translateY(-1px); }
  .btn-registrar:active { transform: translateY(0); }

  /* ── ALERT ── */
  .alert {
    padding: 12px 16px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
    display: none;
    align-items: center; gap: 8px;
  }
  .alert.error { background: rgba(255,59,59,.15); border: 1px solid var(--rojo); color: #FF8888; display: flex; }
  .alert.success { background: rgba(0,201,122,.12); border: 1px solid var(--verde); color: #6EFFC5; display: flex; }
  .alert.hidden { display: none !important; }

  /* ── TABLE PANEL ── */
  .table-panel { display: flex; flex-direction: column; overflow: hidden; }
  .table-toolbar {
    padding: 14px 24px;
    border-bottom: 1px solid var(--gris2);
    display: flex; align-items: center; gap: 12px;
    background: var(--gris1);
  }
  .search-box {
    flex: 1;
    background: var(--gris2);
    border: 1px solid var(--gris3);
    border-radius: 6px;
    color: var(--blanco);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 8px 14px;
    outline: none;
  }
  .search-box:focus { border-color: var(--amarillo); }

  .btn-tool {
    padding: 8px 16px;
    border-radius: 6px;
    border: none; cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px; font-weight: 600;
    letter-spacing: .5px;
    transition: all .2s;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-export { background: var(--gris2); color: var(--amarillo); border: 1px solid var(--amarillo); }
  .btn-export:hover { background: var(--amarillo); color: var(--negro); }
  .btn-reset { background: var(--gris2); color: #FF8888; border: 1px solid var(--rojo); }
  .btn-reset:hover { background: var(--rojo); color: white; }

  .select-periodo {
    background: var(--gris2); border: 1px solid var(--gris3);
    color: var(--blanco); border-radius: 6px;
    padding: 8px 10px; font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    outline: none; cursor: pointer;
  }

  .table-wrap { overflow-y: auto; flex: 1; }

  table { width: 100%; border-collapse: collapse; }
  thead { position: sticky; top: 0; z-index: 10; }
  thead tr { background: var(--gris2); }
  th {
    padding: 12px 16px;
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--amarillo);
    font-weight: 600;
    text-align: left;
    border-bottom: 2px solid var(--gris3);
    white-space: nowrap;
  }
  td {
    padding: 11px 16px;
    font-size: 13px;
    border-bottom: 1px solid var(--gris2);
    font-family: 'IBM Plex Mono', monospace;
    vertical-align: middle;
  }
  tbody tr { transition: background .15s; }
  tbody tr:hover { background: var(--gris2); }
  .placa-cell {
    font-size: 15px; font-weight: 600;
    letter-spacing: 2px; color: var(--amarillo);
  }
  .btn-del {
    background: none; border: none;
    color: var(--gris4); cursor: pointer;
    padding: 4px 8px; border-radius: 4px;
    transition: color .2s;
    font-size: 16px;
  }
  .btn-del:hover { color: var(--rojo); }
  .empty-state {
    text-align: center; padding: 60px 20px;
    color: var(--gris4);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.7); backdrop-filter: blur(4px);
    z-index: 1000; align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--gris1);
    border: 2px solid var(--rojo);
    border-radius: 12px;
    padding: 32px; max-width: 420px; width: 90%;
    text-align: center;
  }
  .modal h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; color: var(--rojo); margin-bottom: 12px; }
  .modal p { color: var(--gris4); font-size: 14px; margin-bottom: 24px; line-height: 1.6; }
  .modal-count { font-family: 'IBM Plex Mono', monospace; font-size: 32px; font-weight: 600; color: var(--amarillo); margin: 12px 0; }
  .modal-btns { display: flex; gap: 12px; justify-content: center; }
  .btn-cancel { padding: 10px 24px; background: var(--gris2); border: 1px solid var(--gris3); color: var(--blanco); border-radius: 6px; cursor: pointer; font-size: 14px; }
  .btn-confirm { padding: 10px 24px; background: var(--rojo); border: none; color: white; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--negro); }
  ::-webkit-scrollbar-thumb { background: var(--gris3); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gris4); }

  .contador { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--gris4); padding: 8px 24px; border-top: 1px solid var(--gris2); }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="#1A1A1A"><rect x="2" y="6" width="20" height="12" rx="2"/><rect x="4" y="8" width="4" height="8" rx="1" fill="#FFD700"/><rect x="16" y="8" width="4" height="8" rx="1" fill="#FFD700"/><rect x="9" y="10" width="6" height="4" rx="1" fill="#FFD700"/></svg>
    </div>
    <div>
      <div class="logo-text">FANAR</div>
      <div class="logo-sub">Sistema de Registro de Placas</div>
    </div>
  </div>
  <div class="header-right">
    <div class="stats-header">
      <div class="stat-pill"><span class="dot dot-moto"></span><span id="stat-motos">0</span> motos</div>
      <div class="stat-pill"><span class="dot dot-vehiculo"></span><span id="stat-vehiculos">0</span> vehículos</div>
    </div>
    <div class="periodo-badge" id="badge-periodo">—</div>
  </div>
</header>

<!-- TABS -->
<div class="tabs">
  <button class="tab-btn active" onclick="setTab('motos')" id="tab-motos">
    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19 10c0-1.1-.9-2-2-2h-1V6c0-2.2-1.8-4-4-4H8C5.8 2 4 3.8 4 6v2H3c-1.1 0-2 .9-2 2v4c0 1.1.9 2 2 2h1c0 1.7 1.3 3 3 3s3-1.3 3-3h4c0 1.7 1.3 3 3 3s3-1.3 3-3h1c.6 0 1-.4 1-1v-3l-2-2zM7 18c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1zm10 0c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1z"/></svg>
    Motocicletas
  </button>
  <button class="tab-btn" onclick="setTab('vehiculos')" id="tab-vehiculos">
    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
    Vehículos
  </button>
</div>

<!-- MAIN -->
<div class="main">

  <!-- FORM -->
  <div class="form-panel">
    <div class="panel-header">
      <span class="panel-title" id="form-title">NUEVA MOTO</span>
    </div>
    <div class="form-body">
      <div id="alert-box" class="alert hidden"></div>

      <div class="field">
        <label>🔑 Número de Placa *</label>
        <input type="text" id="f-placa" class="placa-input" placeholder="ABC123" maxlength="10">
      </div>
      <div class="field">
        <label>Número de Chasis</label>
        <input type="text" id="f-chasis" placeholder="Ej: 9C6PC1427...">
      </div>
      <div class="field" id="campo-motor" style="display:none">
        <label>Número de Motor</label>
        <input type="text" id="f-motor" placeholder="Ej: B16A2-...">
      </div>
      <div class="field" id="campo-marca" style="display:none">
        <label>Marca / Modelo</label>
        <input type="text" id="f-marca_modelo" placeholder="Ej: Toyota Corolla 2020">
      </div>
      <div class="field">
        <label>Cliente</label>
        <input type="text" id="f-cliente" placeholder="Nombre completo">
      </div>
      <div class="field">
        <label>Cédula / Documento</label>
        <input type="text" id="f-cedula" placeholder="Número de documento">
      </div>
      <div class="field">
        <label>Fecha de Recepción</label>
        <input type="date" id="f-fecha">
      </div>
      <div class="field">
        <label>Observaciones</label>
        <textarea id="f-observaciones" placeholder="Notas adicionales..."></textarea>
      </div>

      <button class="btn-registrar" onclick="registrar()">⊕ REGISTRAR</button>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-panel">
    <div class="table-toolbar">
      <input type="text" class="search-box" id="buscador" placeholder="🔍  Buscar por placa, cliente, cédula..." oninput="filtrar()">
      <select class="select-periodo" id="sel-periodo" onchange="cargarTabla()">
        <option>Cargando...</option>
      </select>
      <button class="btn-tool btn-export" onclick="exportar()">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        Excel
      </button>
      <button class="btn-tool btn-reset" onclick="confirmarReinicio()">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        Reiniciar
      </button>
    </div>
    <div class="table-wrap">
      <table id="tabla-registros">
        <thead id="tabla-head"></thead>
        <tbody id="tabla-body"></tbody>
      </table>
    </div>
    <div class="contador" id="contador-text">—</div>
  </div>

</div>

<!-- MODAL CONFIRMACIÓN -->
<div class="modal-overlay" id="modal-reinicio">
  <div class="modal">
    <h2>⚠ REINICIAR PERIODO</h2>
    <p>Esta acción borrará todos los registros del periodo actual. Los datos se guardan en el historial interno y puedes exportar antes de reiniciar.</p>
    <div class="modal-count" id="modal-count">0</div>
    <p style="font-size:12px; font-family: 'IBM Plex Mono',monospace; color: #FFD700;">registros serán archivados</p>
    <div class="modal-btns" style="margin-top:20px">
      <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-confirm" onclick="ejecutarReinicio()">Sí, reiniciar</button>
    </div>
  </div>
</div>

<script>
let tabActual = 'motos';
let todosRegistros = [];

const HEADERS = {
  motos: ['Placa','Chasis','Cliente','Cédula','Fecha','Observaciones',''],
  vehiculos: ['Placa','Chasis','Cliente','Cédula','Fecha','Motor','Marca/Modelo','Observaciones','']
};

// ── INIT ──
window.onload = () => {
  document.getElementById('f-fecha').valueAsDate = new Date();
  cargarPeriodos();
  cargarStats();
  setInterval(cargarStats, 15000);
  setInterval(() => { if(document.getElementById('sel-periodo').value === periodoActual()) cargarTabla(); }, 20000);
};

function periodoActual() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

// ── TABS ──
function setTab(tab) {
  tabActual = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('form-title').textContent = tab === 'motos' ? 'NUEVA MOTO' : 'NUEVO VEHÍCULO';
  document.getElementById('campo-motor').style.display = tab === 'vehiculos' ? '' : 'none';
  document.getElementById('campo-marca').style.display = tab === 'vehiculos' ? '' : 'none';
  limpiarForm(); limpiarAlert();
  cargarTabla();
}

// ── PERIODOS ──
async function cargarPeriodos() {
  const res = await fetch('/api/periodos');
  const periodos = await res.json();
  const sel = document.getElementById('sel-periodo');
  const actual = periodoActual();
  const todos = [...new Set([actual, ...periodos])];
  sel.innerHTML = todos.map(p => `<option value="${p}" ${p===actual?'selected':''}>${formatPeriodo(p)}</option>`).join('');
  cargarTabla();
}

function formatPeriodo(p) {
  const [y,m] = p.split('-');
  const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${meses[parseInt(m)-1]} ${y}`;
}

// ── STATS ──
async function cargarStats() {
  const res = await fetch('/api/stats');
  const s = await res.json();
  document.getElementById('stat-motos').textContent = s.motos;
  document.getElementById('stat-vehiculos').textContent = s.vehiculos;
  document.getElementById('badge-periodo').textContent = formatPeriodo(s.periodo);
}

// ── TABLA ──
async function cargarTabla() {
  const periodo = document.getElementById('sel-periodo').value;
  const res = await fetch(`/api/registros/${tabActual}?periodo=${periodo}`);
  todosRegistros = await res.json();
  renderTabla(todosRegistros);
}

function renderTabla(registros) {
  const head = document.getElementById('tabla-head');
  const body = document.getElementById('tabla-body');
  const hs = HEADERS[tabActual];
  head.innerHTML = `<tr>${hs.map(h=>`<th>${h}</th>`).join('')}</tr>`;

  if (!registros.length) {
    body.innerHTML = `<tr><td colspan="${hs.length}" style="padding:0">
      <div class="empty-state"><div class="icon">📋</div><p>Sin registros en este periodo</p></div>
    </td></tr>`;
    document.getElementById('contador-text').textContent = 'Sin registros';
    return;
  }

  body.innerHTML = registros.map(r => {
    const cols = tabActual === 'motos'
      ? `<td class="placa-cell">${r.placa||'—'}</td>
         <td>${r.chasis||'—'}</td>
         <td>${r.cliente||'—'}</td>
         <td>${r.cedula||'—'}</td>
         <td>${r.fecha||'—'}</td>
         <td style="max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.observaciones||'—'}</td>`
      : `<td class="placa-cell">${r.placa||'—'}</td>
         <td>${r.chasis||'—'}</td>
         <td>${r.cliente||'—'}</td>
         <td>${r.cedula||'—'}</td>
         <td>${r.fecha||'—'}</td>
         <td>${r.motor||'—'}</td>
         <td>${r.marca_modelo||'—'}</td>
         <td style="max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.observaciones||'—'}</td>`;
    return `<tr>${cols}<td><button class="btn-del" onclick="eliminar(${r.id})" title="Eliminar">✕</button></td></tr>`;
  }).join('');
  document.getElementById('contador-text').textContent = `${registros.length} registro${registros.length!==1?'s':''} — ${formatPeriodo(document.getElementById('sel-periodo').value)}`;
}

function filtrar() {
  const q = document.getElementById('buscador').value.toLowerCase();
  if (!q) { renderTabla(todosRegistros); return; }
  const filtrados = todosRegistros.filter(r =>
    (r.placa||'').toLowerCase().includes(q) ||
    (r.cliente||'').toLowerCase().includes(q) ||
    (r.cedula||'').toLowerCase().includes(q) ||
    (r.chasis||'').toLowerCase().includes(q)
  );
  renderTabla(filtrados);
}

// ── REGISTRAR ──
async function registrar() {
  limpiarAlert();
  const placa = document.getElementById('f-placa').value.trim().toUpperCase();
  if (!placa) { showAlert('El número de placa es obligatorio.', 'error'); return; }

  const data = { placa,
    chasis: v('f-chasis'), cliente: v('f-cliente'), cedula: v('f-cedula'),
    fecha: v('f-fecha'), observaciones: v('f-observaciones'),
    motor: v('f-motor'), marca_modelo: v('f-marca_modelo')
  };

  const res = await fetch(`/api/registrar/${tabActual}`, {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)
  });
  const json = await res.json();

  if (json.ok) {
    showAlert(`✓ Placa ${placa} registrada correctamente.`, 'success');
    limpiarForm();
    document.getElementById('sel-periodo').value = periodoActual();
    await cargarTabla();
    await cargarStats();
    await cargarPeriodos();
  } else {
    showAlert(json.error, 'error');
  }
}

// ── ELIMINAR ──
async function eliminar(id) {
  if (!confirm('¿Eliminar este registro?')) return;
  await fetch(`/api/eliminar/${tabActual}/${id}`, {method:'DELETE'});
  await cargarTabla(); await cargarStats();
}

// ── EXPORTAR ──
async function exportar() {
  const periodo = document.getElementById('sel-periodo').value;

  try {
    const res = await fetch(`/api/exportar/${tabActual}?periodo=${periodo}`);

    if (!res.ok) {
      alert("No se pudo generar el Excel");
      return;
    }

    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = `${tabActual}_${periodo}.xlsx`;

    document.body.appendChild(a);
    a.click();

    a.remove();
    window.URL.revokeObjectURL(url);

  } catch (error) {
    alert("Error al exportar Excel");
    console.error(error);
  }
}

// ── REINICIO ──
function confirmarReinicio() {
  const total = todosRegistros.length;
  document.getElementById('modal-count').textContent = total;
  document.getElementById('modal-reinicio').classList.add('show');
}
function cerrarModal() { document.getElementById('modal-reinicio').classList.remove('show'); }
async function ejecutarReinicio() {
  cerrarModal();
  const res = await fetch(`/api/reiniciar/${tabActual}`, {method:'POST'});
  const json = await res.json();
  showAlert(`✓ Reinicio completado. ${json.registros_guardados} registros archivados en historial.`, 'success');
  await cargarTabla(); await cargarStats();
}

// ── HELPERS ──
function v(id) { return document.getElementById(id)?.value || ''; }
function limpiarForm() {
  ['f-placa','f-chasis','f-cliente','f-cedula','f-observaciones','f-motor','f-marca_modelo'].forEach(id => {
    const el = document.getElementById(id); if(el) el.value = '';
  });
  document.getElementById('f-fecha').valueAsDate = new Date();
}
function showAlert(msg, tipo) {
  const el = document.getElementById('alert-box');
  el.textContent = msg;
  el.className = `alert ${tipo}`;
  setTimeout(() => limpiarAlert(), 5000);
}
function limpiarAlert() {
  const el = document.getElementById('alert-box');
  el.className = 'alert hidden';
}
</script>
